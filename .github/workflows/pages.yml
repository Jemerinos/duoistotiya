name: Publish site to GitHub Pages

on:
  push:
    branches: [main, "content-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Don't cancel a running validation/deploy because another small content commit arrived.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-site:
    name: "1/3 — Структура и синтаксис"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML structure and app references
        run: python .github/scripts/check-site.py
      - name: Validate JavaScript syntax
        run: |
          node --check /tmp/site-inline.js
          node --check curriculum.js
          node --check curriculum-depth.js
          node --check curriculum-research.js
          node --check curriculum-participants.js
          node --check curriculum-glossary.js

  validate-course:
    name: "2/3 — Данные курса и детализация"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check all 182 lessons and their depth layer
        run: node .github/scripts/check-course.js

  validate-activities:
    name: "3/3 — Проверка вопросов и интерактивных заданий"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check quizzes, answer keys and image questions
        run: node .github/scripts/check-activities.js

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: Publish validated site
    needs: [validate-site, validate-course, validate-activities]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
