name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Don't cancel a running validation/deploy because another small content commit arrived.
# Superseded PR validations are cancelled; manual audits use a separate event group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-site:
    name: "1/3 — Структура и синтаксис"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML structure and app references
        run: python .github/scripts/check-site.py
      - name: Validate JavaScript syntax
        run: |
          node --check /tmp/site-inline.js
          node --check curriculum.js
          node --check curriculum-depth.js
          node --check curriculum-enrichment-01.js
          node --check curriculum-enrichment-02.js
          node --check curriculum-enrichment-03.js
          node --check curriculum-enrichment-04.js
          node --check curriculum-research.js
          node --check curriculum-enrichment-apply.js
          node --check curriculum-participants.js
          node --check curriculum-participant-sources.js
          node --check curriculum-glossary.js
          node --check curriculum-editor-model.js
          node --check curriculum-visuals.js
          node --check .github/scripts/check-images.js

  validate-course:
    name: "2/3 — Данные курса и детализация"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check all 182 lessons and their depth layer
        run: node .github/scripts/check-course.js

  validate-activities:
    name: "3/3 — Проверка вопросов и интерактивных заданий"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check quizzes, answer keys and image questions
        run: node .github/scripts/check-activities.js

  validate-media:
    name: "4/4 — Изображения и восстановление контекста"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check persistent patch log and recovery state
        run: python .github/scripts/check-project-logs.py
      - name: Check all lesson image routes and viewer behavior
        run: node .github/scripts/check-images.js
      - name: Smoke-test live Wikipedia/Commons API and one real thumbnail
        run: node .github/scripts/check-images.js --online


  audit-gallery:
    if: github.event_name == 'workflow_dispatch'
    name: "Ручной live-аудит галереи уроков 7–9"
    needs: [validate-media]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit live Wikimedia candidates for lessons 7–9
        run: node .github/scripts/check-images.js --online --lesson-audit=7-9

  audit-backgrounds:
    if: github.event_name == 'workflow_dispatch'
    name: "Полный аудит 26 фоновых изображений"
    needs: [validate-media]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify preferred file, article thumbnail and fallback for all modules
        run: node .github/scripts/check-images.js --background-audit

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: Publish validated site
    needs: [validate-site, validate-course, validate-activities, validate-media]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
